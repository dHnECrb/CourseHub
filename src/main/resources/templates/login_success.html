<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>登录成功</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link th:href="@{/style.css}" rel="stylesheet" type="text/css">
</head>
<body>
<div class="main-div">
    <div id="login-div">
        <h1>登录成功！</h1>
        <p th:text="${msg}"></p>
        <button type="button" onclick="enterMain()" id="login-button">进&nbsp;&nbsp;入(<span id="countdown">3</span> s)</button>
    </div>
</div>
<script>
    let remainingSeconds = 3;
    const countdownElement = document.getElementById('countdown');

    function enterMain() {
        window.location.href = '/app_1/main';
    }

    const countdownTimer = setInterval(() => {
        remainingSeconds--;
        if (remainingSeconds > 0) {
            countdownElement.textContent = remainingSeconds;
        } else {
            clearInterval(countdownTimer);
            enterMain();
        }
    }, 1000);
</script>
</body>
</html>
