<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>用户主页</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link th:href="@{/user_main_style.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/idle_mask.css}" rel="stylesheet" type="text/css">
</head>
<body>


    <!-- 遮罩层 + 警告弹窗 -->
    <div id="idle-mask" style="display:none;">
        <div id="idle-dialog" role="alertdialog" aria-modal="true">
            <div id="idle-title">会话即将过期</div>
            <div id="idle-message">
                检测到您长时间未操作，<span id="idle-countdown">30</span> 秒后将自动退出登录。
            </div>
            <div id="idle-buttons">
                <button id="idle-stay" class="btn btn-primary">继续会话</button>
                <button id="idle-logout" class="btn btn-secondary">退出登录</button>
            </div>
        </div>
    </div>

    <!-- 公告遮罩层与弹窗，定位和会话过期提示保持一致 -->
    <div id="announcement-mask" th:if="${announcement != null}"
         th:attr="data-announcement-id=${announcement.id}">
        <div id="announcement-dialog" role="alertdialog" aria-modal="true" aria-labelledby="announcement-title">
            <h2 id="announcement-title" th:text="${announcement.title}"></h2>
            <p class="announcement-time"
               th:text="|发布时间：${#temporals.format(announcement.publish_time, 'yyyy-MM-dd HH:mm')}|"></p>
            <div class="announcement-content" th:text="${announcement.content}"></div>
            <p id="announcement-error" class="announcement-error" role="alert"></p>
            <div class="announcement-buttons">
                <button type="button" id="announcement-confirm" class="btn btn-secondary">确认</button>
                <button type="button" id="announcement-no-remind" class="btn btn-primary">确认且不再提示</button>
            </div>
        </div>
    </div>

    <div id="header">
        <div id="header-left">
            主界面
        </div>
        <div id="header-right">
            <p th:text="${userId}"></p>
            <button type="button" onClick="window.location.href='/app_1/main/logout'" id="logout-button">退出</button>

        </div>
    </div>
    <div id="main-div">
        <div id="option">
            <div>
                <input type="checkbox" id="filter-time" checked>
                <label for="filter-time">筛选在时间范围内的任务</label>
            </div>
            <button onclick="refreshTaskTable()">刷新任务</button>
        </div>
        <table>
            <thead>
            <tr>
                <th>序号</th>
                <th>名称</th>
                <th>详细信息</th>
                <th>入口</th>
                <th>开始时间</th>
                <th>结束时间</th>
            </tr>
            </thead>

            <tbody id="task-body">
<!--            <tr th:each="task,stat : ${tasks}">-->
<!--                <td th:text="${stat.count}"></td>-->
<!--                <td th:text="${task.name}"></td>-->
<!--                <td th:text="${task.comment}"></td>-->
<!--                <td th:text="${task.start_time}"></td>-->
<!--                <td th:text="${task.deadline_time}"></td>-->
<!--                <td><a th:href="|/app_1${task.site}|" th:text="${task.name}"></a></td>-->
<!--            </tr>-->
            </tbody>
        </table>
    </div>

    <script th:src="@{/heartbeat.js}"></script>
    <script>
        function refreshTaskTable() {
            let filterTime = document.getElementById('filter-time').checked;

            // 2. 发请求给后端接口（GET 示例）
            fetch('/app_1/main/tasks?filterTime=' + filterTime)
                .then(resp => resp.json())
                .then(tasks => {
                    // 3. 清空旧数据，重新渲染
                    const tbody = document.getElementById('task-body');
                    tbody.innerHTML = '';

                    tasks.forEach((task, index) => {
                        const tr = document.createElement('tr');
                        // 将 ISO 时间格式化为 "YYYY-MM-DD HH:mm"
                        const formatTime = (t) => (t || '').replace('T', ' ').slice(0, 16) || '—';
                        const comment = task.comment && task.comment.trim() ? task.comment : '—';
                        tr.innerHTML =
                            `<td>${index + 1}</td>` +
                            `<td>${task.name}</td>` +
                            `<td>${comment}</td>` +
                            `<td><a href="/app_1${task.site}">进入</a></td>`+
                            `<td>${formatTime(task.start_time)}</td>` +
                            `<td>${formatTime(task.deadline_time)}</td>`;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error("任务请求失败：", err);
                    alert('请求失败');
                });
        }

        const announcementMask = document.getElementById('announcement-mask');
        if (announcementMask) {
            const confirmButton = document.getElementById('announcement-confirm');
            const noRemindButton = document.getElementById('announcement-no-remind');
            const errorElement = document.getElementById('announcement-error');

            confirmButton.addEventListener('click', () => {
                announcementMask.style.display = 'none';
            });

            noRemindButton.addEventListener('click', async () => {
                confirmButton.disabled = true;
                noRemindButton.disabled = true;
                errorElement.textContent = '';
                try {
                    const resp = await fetch('/app_1/main/announcement/read', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: new URLSearchParams({
                            announcementId: announcementMask.dataset.announcementId
                        })
                    });
                    if (resp.status === 401) {
                        alert('登录已过期，请重新登录。');
                        window.location.href = '/app_1/login';
                        return;
                    }
                    const result = await resp.json();
                    if (resp.ok && result.isSucceed) {
                        announcementMask.style.display = 'none';
                    } else {
                        errorElement.textContent = result.string || '设置失败，请重试。';
                    }
                } catch (err) {
                    console.error('公告确认请求失败：', err);
                    errorElement.textContent = '请求失败，请重试。';
                } finally {
                    confirmButton.disabled = false;
                    noRemindButton.disabled = false;
                }
            });
        }
        refreshTaskTable();
    </script>
</body>
</html>
