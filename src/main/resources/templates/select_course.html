<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>预选课系统</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link th:href="@{/select_course_style.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/idle_mask.css}" rel="stylesheet" type="text/css">
</head>
<body>

<!--返回上一级：固定于左上角，不随滚动移动-->
<button id="back-button" type="button" onclick="history.back()">← 返回上一级</button>

<!--会话过期的遮罩（heartbeat.js 依赖此结构）-->
<div id="idle-mask" style="display:none;">
    <div id="idle-dialog" role="alertdialog" aria-modal="true">
        <div id="idle-title">会话即将过期</div>
        <div id="idle-message">
            检测到您长时间未操作，<span id="idle-countdown">30</span> 秒后将自动退出登录。
        </div>
        <div id="idle-buttons">
            <button id="idle-stay" class="btn btn-primary">继续会话</button>
            <button id="idle-logout" class="btn btn-secondary">退出登录</button>
        </div>
    </div>
</div>

<!--学分不足提交确认弹窗（自定义，替代浏览器 confirm）-->
<div id="credit-mask" class="dialog-mask" style="display:none;">
    <div class="dialog-box" role="alertdialog" aria-modal="true">
        <div class="dialog-title">⚠️ 学分不足警告</div>
        <div class="dialog-message" id="credit-message"></div>
        <div class="dialog-buttons">
            <button id="credit-confirm" class="btn btn-primary">坚持提交</button>
            <button id="credit-cancel" class="btn btn-secondary">返回修改</button>
        </div>
    </div>
</div>

<!--筛选确认弹窗（自定义，替代浏览器 confirm）-->
<div id="filter-mask" class="dialog-mask" style="display:none;">
    <div class="dialog-box" role="alertdialog" aria-modal="true">
        <div class="dialog-title">过滤可能不开课的课程</div>
        <div class="dialog-message">是否同时取消选择所有“可能不开课”的课程？</div>
        <div class="dialog-buttons">
            <button id="filter-uncheck" class="btn btn-primary">取消选择并筛选</button>
            <button id="filter-keep" class="btn btn-secondary">保留选择，仅筛选</button>
            <button id="filter-abort" class="btn btn-secondary">取消</button>
        </div>
    </div>
</div>

<!--顶部固定区域：进度条 + 警告信息，不随页面滚动-->
<header class="fixed-header">
    <section class="progress-panel" aria-label="选课学分进度">
        <div id="practiceBar" class="bar-row"></div>
        <div id="majorBar" class="bar-row"></div>
        <div id="globalWarning" class="warning-line" aria-live="polite"></div>
    </section>
    <div class="legend">
        <span class="legend-item"><i class="swatch done"></i>已修</span>
        <span class="legend-item"><i class="swatch doing"></i>正在修读</span>
        <span class="legend-item"><i class="swatch can"></i>已选（能开课）</span>
        <span class="legend-item"><i class="swatch maybe"></i>已选（可能开课）</span>
        <span class="legend-item"><i class="swatch red"></i>未达到毕业要求</span>
        <span class="legend-item"><i class="swatch orange"></i>依赖“可能开课”课程才达标</span>
    </div>
</header>

<main class="main">
    <section class="card">
        <div class="card-title">预选课程列表</div>
        <div class="filter-row">
            <input type="checkbox" id="filter-will-offer">
            <label for="filter-will-offer">过滤可能不开课的课程</label>
            <button id="filter-button" type="button">筛选</button>
        </div>
        <table>
            <thead>
            <tr>
                <th style="width:6%">编号</th>
                <th style="width:12%">课程编号</th>
                <th style="width:22%">课程名称</th>
                <th style="width:9%">课程学分</th>
                <th style="width:13%">课程性质</th>
                <th style="width:14%">开课学年学期</th>
                <th style="width:10%">能否开课</th>
                <th style="width:8%">选择</th>
            </tr>
            </thead>
            <tbody id="courseBody"></tbody>
        </table>
    </section>

    <div class="submit-row">
        <button id="submit-button" type="button">提交</button>
    </div>

    <section class="card">
        <div class="card-title">
            <span>我的修读课程（已修、正在修读与已选）</span>
            <button id="refresh-selected" type="button">刷新</button>
        </div>
        <table>
            <thead>
            <tr>
                <th style="width:6%">编号</th>
                <th style="width:12%">课程编号</th>
                <th style="width:22%">课程名称</th>
                <th style="width:9%">课程学分</th>
                <th style="width:13%">课程性质</th>
                <th style="width:14%">开课学年学期</th>
                <th style="width:14%">修读状态</th>
            </tr>
            </thead>
            <tbody id="selectedBody"></tbody>
        </table>
    </section>
</main>

<script th:src="@{/heartbeat.js}"></script>
<script>
    /* ================= 配置 ================= */
    // 两种课程性质：总量与毕业要求学分固定，已修/正在修读学分由后端数据计算
    const CATEGORIES = {
        practice: { key: 'practice', match: '实践', label: '实践选修课', total: 12, graduate: 6 },
        major:    { key: 'major',    match: '专业', label: '专业选修课', total: 36, graduate: 18 }
    };

    // 后端接口（context-path /app_1 与前端 JS 约定一致）
    const URL_TO_SELECT = '/app_1/student/select_course/get_to_select';
    const URL_SELECTED  = '/app_1/student/select_course/get_selected';
    // 提交接口后端尚未实现；设计为 POST {select: [课程编号], cancel: [课程编号]}，
    // 与 SelectCourseService.ChangeSelectCourses(httpSession, courseIdList, insertOrDelete) 对应
    const URL_SUBMIT    = '/app_1/student/select_course/submit';

    /* ================= 数据 ================= */
    let courses = [];                    // 下一学期可选课程（get_to_select）
    let initialChosen = new Set();       // 加载时已选的课程编号，用于提交时做增量
    // 已修/正在修读学分（按课程性质累计），来自 get_selected
    const fixedCredits = { practice: { done: 0, doing: 0 }, major: { done: 0, doing: 0 } };
    let currentProblems = [];            // 当前警告信息（供提交弹窗使用）

    function categoryOf(property) {
        for (const cat of Object.values(CATEGORIES)) {
            if (property && property.includes(cat.match)) return cat.key;
        }
        return null;
    }

    /* ================= 待选课程表格 ================= */
    function renderCourseTable() {
        const body = document.getElementById('courseBody');
        body.innerHTML = courses.map((c, i) => `
            <tr data-course-id="${c.courseId}">
                <td>${i + 1}</td>
                <td>${c.courseId}</td>
                <td class="course-name">${c.courseName}</td>
                <td>${c.credit}</td>
                <td>${c.property}</td>
                <td>${c.term}</td>
                <!-- willOffer 为“否”的课程此列留空 -->
                <td class="${c.willOffer === '是' ? 'yes' : ''}">${c.willOffer === '是' ? '是' : ''}</td>
                <td><input type="checkbox" class="course-check"
                           data-course-id="${c.courseId}" ${c.chosen ? 'checked' : ''}
                           aria-label="选择${c.courseName}"></td>
            </tr>
        `).join('');
        applyFilter();
    }

    function applyFilter() {
        const hideMaybe = document.getElementById('filter-will-offer').checked;
        let visibleNo = 0;
        document.querySelectorAll('#courseBody tr').forEach(tr => {
            const c = courses.find(x => String(x.courseId) === tr.dataset.courseId);
            const hidden = hideMaybe && c.willOffer !== '是';
            tr.style.display = hidden ? 'none' : '';
            if (!hidden) {
                // 筛选后编号重新从 1 连续排列
                tr.cells[0].textContent = ++visibleNo;
            }
        });
    }

    /* ================= 已修课程表格 ================= */
    function renderSelectedTable(selectedCourses) {
        const body = document.getElementById('selectedBody');
        body.innerHTML = selectedCourses.map((c, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${c.courseId}</td>
                <td class="course-name">${c.courseName}</td>
                <td>${c.credit}</td>
                <td>${c.property}</td>
                <td>${c.term}</td>
                <td>${c.status}</td>
            </tr>
        `).join('');
    }

    /* ================= 进度条 ================= */
    // 每个课程性质一条进度条，DOM 只创建一次，之后只改样式，
    // 靠 CSS transition 实现匀速变化；动画中再次修改会从中途位置继续。
    const SEG_DEFS = [
        { cls: 'done',  label: '已修' },
        { cls: 'doing', label: '正在修读' },
        { cls: 'can',   label: '已选（能开课）' },
        { cls: 'maybe', label: '已选（可能开课）' }
    ];
    const barStates = {};   // key -> {riskSig, timer}

    function buildBar(cat) {
        const row = document.getElementById(cat.key + 'Bar');
        row.innerHTML = `
            <div class="bar-label"><span class="warn-icon"></span><span>${cat.label}</span></div>
            <div class="bar-area">
                <div class="seg-label-row">
                    ${SEG_DEFS.map(d => `<div class="seg-label seg-label-${d.cls}"></div>`).join('')}
                </div>
                <div class="progress-track" aria-label="${cat.label}进度">
                    ${SEG_DEFS.map(d => `<div class="seg ${d.cls}" style="left:0;width:0"></div>`).join('')}
                    <div class="seg risk-overlay risk-hidden"></div>
                    <div class="grad-line" data-credit="${cat.graduate} 学分"
                         style="left:${cat.graduate / cat.total * 100}%"></div>
                </div>
                <div class="risk-info"></div>
            </div>
            <div class="total-credit">${cat.total} 学分</div>
        `;
        barStates[cat.key] = { riskSig: null, timer: null };
    }

    /**调整分段上方学分标签，避免相邻文字过近时重叠：放不下时放到第二行交错显示*/
    function layoutLabels(cat) {
        const row = document.getElementById(cat.key + 'Bar');
        const trackW = row.querySelector('.progress-track').clientWidth || 600;
        // 估算每个标签文字的实际像素宽度（中文约 13px/字）
        const labels = SEG_DEFS.map(d => {
            const el = row.querySelector('.seg-label-' + d.cls);
            if (el.style.display === 'none') return null;
            const leftPct = parseFloat(el.style.left) || 0;
            const widthPct = parseFloat(el.style.width) || 0;
            const textW = el.textContent.length * 13;
            const centerPx = (leftPct + widthPct / 2) / 100 * trackW;
            return { el, leftPx: centerPx - textW / 2, rightPx: centerPx + textW / 2 };
        }).filter(Boolean);
        // 按从左到右的顺序分配到两行，与同一行上一个标签不重叠即可
        const rowRight = [0, 0];
        labels.sort((a, b) => a.leftPx - b.leftPx);
        labels.forEach(lb => {
            let line = 0;
            if (lb.leftPx < rowRight[0] - 4 && lb.leftPx >= rowRight[1] - 4) line = 1;
            rowRight[line] = lb.rightPx;
            lb.el.style.top = (line * 20) + 'px';
        });
    }

    /**更新风险覆盖层（红/橙）：先淡出，分段变化完成后，新的风险层再淡入*/
    function setRiskOverlay(cat, st) {
        const state = barStates[cat.key];
        const row = document.getElementById(cat.key + 'Bar');
        const overlay = row.querySelector('.risk-overlay');
        const info = row.querySelector('.risk-info');
        const pct = v => v / cat.total * 100;

        const sig = st.risk ? st.risk.kind + ':' + st.risk.start + '-' + st.risk.end : null;
        if (state.riskSig === sig) return;   // 无变化
        state.riskSig = sig;
        clearTimeout(state.timer);

        // 橙色/红色先消失
        overlay.classList.add('risk-hidden');
        state.timer = setTimeout(() => {
            // 更新风险层的样式与数值（此时不可见）
            overlay.classList.remove('risk-red', 'risk-orange');
            if (st.risk) {
                overlay.classList.add('risk-' + st.risk.kind);
                overlay.style.left = pct(st.risk.start) + '%';
                overlay.style.width = pct(st.risk.end - st.risk.start) + '%';
                info.textContent = st.risk.kind === 'red'
                    ? `距毕业要求还差 ${st.risk.end - st.risk.start} 学分`
                    : `除去“已选（可能开课）”后仍差 ${st.risk.end - st.risk.start} 学分`;
                info.className = 'risk-info risk-info-' + st.risk.kind;
            } else {
                overlay.style.width = '0';
                info.textContent = '';
                info.className = 'risk-info';
            }
            // 其他部分完成后，风险层出现
            state.timer = setTimeout(() => {
                if (st.risk) overlay.classList.remove('risk-hidden');
            }, 600);
        }, 300);
    }

    function updateBar(cat, st) {
        const row = document.getElementById(cat.key + 'Bar');
        const pct = v => v / cat.total * 100;
        const values = { done: st.done, doing: st.doing, can: st.can, maybe: st.maybe };
        const leftOf = {
            done: 0,
            doing: st.done,
            can: st.done + st.doing,
            maybe: st.certain
        };
        SEG_DEFS.forEach(d => {
            const seg = row.querySelector('.seg.' + d.cls);
            seg.style.left = pct(leftOf[d.cls]) + '%';
            seg.style.width = pct(values[d.cls]) + '%';
            seg.classList.toggle('seg-zero', values[d.cls] === 0);
            const label = row.querySelector('.seg-label-' + d.cls);
            if (values[d.cls] > 0) {
                label.style.display = '';
                label.style.left = pct(leftOf[d.cls]) + '%';
                label.style.width = pct(values[d.cls]) + '%';
                label.textContent = `${d.label} ${values[d.cls]}`;
            } else {
                label.style.display = 'none';
            }
        });
        layoutLabels(cat);
        setRiskOverlay(cat, st);

        // 左侧标志：⚠️ 有学分问题，✅ 去掉“可能开课”后也能毕业
        const icon = row.querySelector('.warn-icon');
        icon.textContent = st.warning ? '⚠️' : '✅';
        icon.title = st.warning ? '学分不足警告' : '学分满足毕业要求';
    }

    function getCheckedByCategory() {
        // 统计复选框勾选情况：已选（能开课）与已选（可能开课）的学分
        const result = { practice: { can: 0, maybe: 0 }, major: { can: 0, maybe: 0 } };
        document.querySelectorAll('.course-check:checked').forEach(box => {
            const c = courses.find(x => String(x.courseId) === box.dataset.courseId);
            const key = categoryOf(c.property);
            if (!key) return;
            result[key][c.willOffer === '是' ? 'can' : 'maybe'] += c.credit;
        });
        return result;
    }

    function calcState(cat, sel) {
        const done = fixedCredits[cat.key].done;
        const doing = fixedCredits[cat.key].doing;
        const fixed = done + doing;
        const can = sel.can;
        const maybe = sel.maybe;
        const certain = fixed + can;      // 除去“已选（可能开课）”后的学分
        const total = certain + maybe;    // 全部已选 + 已修/在读
        let warning = false;
        let risk = null;
        if (total < cat.graduate) {
            // 红色：从最后一个非空分段（可能开课→能开课→正在修读→已修）之后到毕业学分处
            warning = true;
            let start;
            if (maybe > 0) start = total;
            else if (can > 0) start = fixed + can;
            else if (doing > 0) start = done + doing;
            else if (done > 0) start = done;
            else start = 0;
            risk = { kind: 'red', start, end: cat.graduate };
        } else if (certain < cat.graduate) {
            // 橙色：依赖“可能开课”课程才达标
            warning = true;
            risk = { kind: 'orange', start: certain, end: cat.graduate };
        }
        return { done, doing, can, maybe, certain, total, warning, risk };
    }

    function update() {
        const selected = getCheckedByCategory();
        Object.values(CATEGORIES).forEach(cat => updateBar(cat, calcState(cat, selected[cat.key])));

        // 警告信息：两种课程性质分行显示
        currentProblems = [];
        Object.values(CATEGORIES).forEach(cat => {
            const st = calcState(cat, selected[cat.key]);
            if (st.total < cat.graduate) {
                currentProblems.push(`⚠️ ${cat.label}：已选课程与已修、正在修读学分合计 ${st.total} 学分，距毕业要求（${cat.graduate} 学分）还差 ${cat.graduate - st.total} 学分。`);
            } else if (st.certain < cat.graduate) {
                currentProblems.push(`⚠️ ${cat.label}：除去“已选（可能开课）”课程后仅有 ${st.certain} 学分，仍差 ${cat.graduate - st.certain} 学分，请增加确定开课的课程。`);
            }
        });
        document.getElementById('globalWarning').innerHTML =
            currentProblems.map(p => `<div>${p}</div>`).join('');
        adjustMainPadding();

        // 勾选行的背景高亮
        document.querySelectorAll('#courseBody tr').forEach(tr => {
            tr.classList.toggle('selected', tr.querySelector('.course-check').checked);
        });
    }

    /* ================= 数据加载 ================= */
    async function loadToSelect() {
        const resp = await fetch(URL_TO_SELECT + '?filterWillOffer=false');
        if (resp.status === 401) {
            alert('登录过期，请返回登录界面。');
            window.location.href = '/app_1/login';
            return;
        }
        courses = await resp.json();
        initialChosen = new Set(courses.filter(c => c.chosen).map(c => String(c.courseId)));
        renderCourseTable();
    }

    async function loadSelected() {
        const resp = await fetch(URL_SELECTED);
        if (resp.status === 401) {
            alert('登录过期，请返回登录界面。');
            window.location.href = '/app_1/login';
            return;
        }
        const selectedCourses = await resp.json();
        // 按课程性质累计已修、正在修读学分
        Object.keys(fixedCredits).forEach(k => fixedCredits[k] = { done: 0, doing: 0 });
        selectedCourses.forEach(c => {
            const key = categoryOf(c.property);
            if (!key) return;
            if (c.status === '已修') fixedCredits[key].done += c.credit;
            else if (c.status === '正在修读') fixedCredits[key].doing += c.credit;
        });
        renderSelectedTable(selectedCourses);
    }

    async function loadAll() {
        try {
            await loadToSelect();
            await loadSelected();
            update();
        } catch (err) {
            console.error('数据加载失败：', err);
            alert('数据加载失败，请刷新重试。');
        }
    }

    /* ================= 弹窗工具 ================= */
    function showMask(id) { document.getElementById(id).style.display = 'flex'; }
    function hideMask(id) { document.getElementById(id).style.display = 'none'; }

    /* ================= 提交 ================= */
    async function doSubmit() {
        const checked = new Set(
            [...document.querySelectorAll('.course-check:checked')]
                .map(box => box.dataset.courseId)
        );
        const toSelect = [...checked].filter(id => !initialChosen.has(id));
        const toCancel = [...initialChosen].filter(id => !checked.has(id));

        try {
            const resp = await fetch(URL_SUBMIT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ select: toSelect, cancel: toCancel })
            });
            if (resp.ok) {
                alert('提交成功！');
                await loadAll();   // 提交成功后刷新下方已修课程表格
            } else if (resp.status === 404 || resp.status === 405) {
                alert('后端提交接口尚未实现，本次选择未保存。\n（计划发送的数据：' +
                    JSON.stringify({ select: toSelect, cancel: toCancel }) + '）');
            } else {
                alert('提交失败：' + resp.status);
            }
        } catch (err) {
            console.error('提交失败：', err);
            alert('网络错误，提交失败。');
        }
    }

    function submitSelections() {
        const checkedCount = document.querySelectorAll('.course-check:checked').length;
        const initialCount = initialChosen.size;
        if (checkedCount === initialCount &&
            [...document.querySelectorAll('.course-check:checked')]
                .every(box => initialChosen.has(box.dataset.courseId))) {
            alert('选择没有变化，无需提交。');
            return;
        }

        if (currentProblems.length === 0) {
            doSubmit();
            return;
        }
        // 学分不足：自定义弹窗，文字写明警告原因
        document.getElementById('credit-message').innerHTML =
            currentProblems.map(p => `<div>${p}</div>`).join('') +
            '<div style="margin-top:8px">确定仍要提交吗？</div>';
        showMask('credit-mask');
    }

    /* ================= 筛选 ================= */
    function uncheckMaybeCourses() {
        document.querySelectorAll('.course-check:checked').forEach(box => {
            const c = courses.find(x => String(x.courseId) === box.dataset.courseId);
            if (c.willOffer !== '是') box.checked = false;
        });
        update();
    }

    function onFilterClicked() {
        const checkbox = document.getElementById('filter-will-offer');
        if (!checkbox.checked) {
            applyFilter();   // 取消筛选，直接显示全部
            return;
        }
        // 有需要隐藏的已选课程时才询问
        const anyCheckedMaybe = [...document.querySelectorAll('.course-check:checked')]
            .some(box => courses.find(x => String(x.courseId) === box.dataset.courseId).willOffer !== '是');
        if (!anyCheckedMaybe) {
            applyFilter();
            return;
        }
        showMask('filter-mask');
    }

    /* ================= 事件绑定 ================= */
    // 顶部固定头部高度不固定（警告信息可能换行），动态调整正文的上边距，避免标题被遮挡
    function adjustMainPadding() {
        const header = document.querySelector('.fixed-header');
        document.querySelector('.main').style.paddingTop = (header.offsetHeight + 20) + 'px';
    }
    window.addEventListener('resize', () => {
        adjustMainPadding();
        Object.values(CATEGORIES).forEach(layoutLabels);
    });

    document.addEventListener('change', e => {
        if (e.target.matches('.course-check')) update();
    });
    document.getElementById('filter-button').addEventListener('click', onFilterClicked);
    document.getElementById('submit-button').addEventListener('click', submitSelections);
    document.getElementById('refresh-selected').addEventListener('click', loadSelected);

    // 提交确认弹窗按钮
    document.getElementById('credit-confirm').addEventListener('click', () => { hideMask('credit-mask'); doSubmit(); });
    document.getElementById('credit-cancel').addEventListener('click', () => hideMask('credit-mask'));
    // 筛选弹窗按钮
    document.getElementById('filter-uncheck').addEventListener('click', () => { hideMask('filter-mask'); uncheckMaybeCourses(); applyFilter(); });
    document.getElementById('filter-keep').addEventListener('click', () => { hideMask('filter-mask'); applyFilter(); });
    document.getElementById('filter-abort').addEventListener('click', () => {
        hideMask('filter-mask');
        document.getElementById('filter-will-offer').checked = false;
    });

    // 初始化进度条骨架
    Object.values(CATEGORIES).forEach(buildBar);
    loadAll();
</script>
</body>
</html>
