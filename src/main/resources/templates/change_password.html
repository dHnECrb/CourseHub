<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link th:href="@{/select_course_style.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/idle_mask.css}" rel="stylesheet" type="text/css">
    <style>
        .main{max-width:640px;margin:0 auto;padding:60px 18px 50px}
        .form-row{
            display:grid;
            grid-template-columns:110px 1fr;
            align-items:start;
            gap:10px 14px;
            padding:14px 22px;
        }
        .form-row label{padding-top:9px;font-size:15px;text-align:right}
        .form-row input{
            width:100%;
            padding:8px 10px;
            font-size:15px;
            border:1px solid #94a3b8;
            border-radius:6px;
        }
        /*错误：红框；警告：黄框*/
        .form-row input.input-error{border:2px solid #e7000b}
        .form-row input.input-warning{border:2px solid #eab308}
        .msg-error{color:#b91c1c;font-size:13px;margin-top:4px;min-height:18px}
        .msg-warning{color:#a16207;font-size:13px;margin-top:4px;min-height:18px}
    </style>
</head>
<body>

<button id="back-button" type="button" onclick="history.back()">← 返回上一级</button>

<!--会话过期的遮罩（heartbeat.js 依赖此结构）-->
<div id="idle-mask" style="display:none;">
    <div id="idle-dialog" role="alertdialog" aria-modal="true">
        <div id="idle-title">会话即将过期</div>
        <div id="idle-message">
            检测到您长时间未操作，<span id="idle-countdown">30</span> 秒后将自动退出登录。
        </div>
        <div id="idle-buttons">
            <button id="idle-stay" class="btn btn-primary">继续会话</button>
            <button id="idle-logout" class="btn btn-secondary">退出登录</button>
        </div>
    </div>
</div>

<main class="main">
    <section class="card">
        <div class="card-title">修改密码</div>
        <div class="form-row">
            <label for="old-password">旧密码</label>
            <div>
                <input type="password" id="old-password" autocomplete="current-password">
                <div class="msg-error" id="old-password-msg"></div>
            </div>
        </div>
        <div class="form-row">
            <label for="new-password">新密码</label>
            <div>
                <input type="password" id="new-password" autocomplete="new-password">
                <div class="msg-error" id="new-password-error"></div>
                <div class="msg-warning" id="new-password-warning"></div>
            </div>
        </div>
        <div class="form-row">
            <label for="confirm-password">确认新密码</label>
            <div>
                <input type="password" id="confirm-password" autocomplete="new-password">
                <div class="msg-error" id="confirm-password-msg"></div>
            </div>
        </div>
        <div class="submit-row">
            <button type="button" id="submit-button">提交</button>
        </div>
    </section>
</main>

<script th:src="@{/heartbeat.js}"></script>
<script th:inline="javascript">
    // 当前登录用户的账号，用于弱密码检查（与账号相同的密码视为弱密码）
    const USER_ID = /*[[${userId}]]*/ '';

    const MIN_LENGTH = 9;
    const MAX_LENGTH = 25;
    const URL_SUBMIT = '/app_1/change_password/submit';

    const oldPasswordInput = document.getElementById('old-password');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');

    /**弱密码检查：纯数字、纯字母、全部相同字符、与账号相同，均视为弱密码*/
    function getPasswordWarning(password) {
        if (!password) return '';
        if (/^\d+$/.test(password)) return '密码为纯数字，安全性较弱，建议混合使用字母、数字和符号。';
        if (/^[a-zA-Z]+$/.test(password)) return '密码为纯字母，安全性较弱，建议混合使用字母、数字和符号。';
        if (/^(.)\1+$/.test(password)) return '密码字符全部相同，安全性较弱，建议混合使用字母、数字和符号。';
        if (USER_ID && password === USER_ID) return '密码与账号相同，安全性较弱，建议更换。';
        return '';
    }

    function validateNewPassword() {
        const password = newPasswordInput.value;
        let error = '';
        if (password.length < MIN_LENGTH) {
            error = '密码长度不能少于' + MIN_LENGTH + '位。';
        } else if (password.length > MAX_LENGTH) {
            // 超过 25 位不阻止输入，只提示错误
            error = '密码长度不能超过' + MAX_LENGTH + '位。';
        }
        const warning = error ? '' : getPasswordWarning(password);

        document.getElementById('new-password-error').textContent = error;
        document.getElementById('new-password-warning').textContent = warning;
        newPasswordInput.classList.remove('input-error', 'input-warning');
        if (error) {
            newPasswordInput.classList.add('input-error');
        } else if (warning) {
            newPasswordInput.classList.add('input-warning');
        }
        return error === '';
    }

    function validateConfirmPassword() {
        const confirm = confirmPasswordInput.value;
        const error = confirm && confirm !== newPasswordInput.value
            ? '两次输入的新密码不一致。' : '';
        document.getElementById('confirm-password-msg').textContent = error;
        confirmPasswordInput.classList.toggle('input-error', error !== '');
        return error === '';
    }

    function validateOldPassword() {
        const error = oldPasswordInput.value ? '' : '请输入旧密码。';
        document.getElementById('old-password-msg').textContent = error;
        oldPasswordInput.classList.toggle('input-error', error !== '');
        return error === '';
    }

    async function submit() {
        const oldOk = validateOldPassword();
        const newOk = validateNewPassword();
        const confirmOk = validateConfirmPassword();
        if (!oldOk || !newOk || !confirmOk) {
            return;
        }
        try {
            const resp = await fetch(URL_SUBMIT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    oldPassword: oldPasswordInput.value,
                    newPassword: newPasswordInput.value
                })
            });
            if (resp.status === 401) {
                alert('登录已过期，请重新登录。');
                window.location.href = '/app_1/login';
                return;
            }
            const result = await resp.json();
            alert(result.string || (result.isSucceed ? '密码修改成功。' : '密码修改失败。'));
            if (result.isSucceed) {
                window.location.href = '/app_1/main';
            }
        } catch (err) {
            console.error('修改密码请求失败：', err);
            alert('请求失败，请重试。');
        }
    }

    oldPasswordInput.addEventListener('input', validateOldPassword);
    newPasswordInput.addEventListener('input', function () {
        validateNewPassword();
        validateConfirmPassword();
    });
    confirmPasswordInput.addEventListener('input', validateConfirmPassword);
    document.getElementById('submit-button').addEventListener('click', submit);
</script>
</body>
</html>
